[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-akouo-plugin"
version = "0.9.1"
description = "AKOÚŌ Hermes Plugin — 17 epistemically-disciplined listening modes for Hermes Agent"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Chris Wenn", email = "chris@techne-tools.org"}
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/techne-tools/hermes-akouo-plugin"
Repository = "https://github.com/techne-tools/hermes-akouo-plugin.git"
Upstream = "https://github.com/sonicfieldlabs/akouo"

[project.entry-points."hermes_agent.plugins"]
akouo = "akouo_plugin"
